name: verify

# Runs on every push and pull request. A milestone is only considered verified
# when the jobs below are green for the exact commit that was pushed.
on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

env:
  GRADLE_OPTS: "-Dorg.gradle.daemon=false -Dkotlin.incremental=true"

jobs:
  hygiene:
    name: repository hygiene
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: secret scan
        run: python3 tools/ci/secret_scan.py
      - name: repository checks
        run: python3 tools/ci/repo_hygiene.py

  core:
    name: domain core tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: run :core tests
        run: ./gradlew :core:test --stacktrace
      - name: upload core test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: core-test-report
          path: core/build/reports/tests/test
          if-no-files-found: ignore

  android:
    name: android build, tests and lint
    runs-on: ubuntu-latest
    needs: [hygiene, core]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: ensure android sdk platform
        run: |
          if [ ! -d "$ANDROID_HOME/platforms/android-35" ]; then
            yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "platforms;android-35" >/dev/null
          fi
          if [ ! -d "$ANDROID_HOME/build-tools/35.0.0" ]; then
            yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "build-tools;35.0.0" >/dev/null
          fi
          echo "installed platforms:" && ls "$ANDROID_HOME/platforms"

      - uses: gradle/actions/setup-gradle@v4

      - name: unit tests
        run: ./gradlew :app:testDebugUnitTest --stacktrace

      - name: assemble debug
        run: ./gradlew :app:assembleDebug --stacktrace

      - name: assemble release and bundle release
        run: ./gradlew :app:assembleRelease :app:bundleRelease --stacktrace

      - name: lint
        run: ./gradlew :app:lintDebug --stacktrace

      - name: upload apk and aab
        uses: actions/upload-artifact@v4
        with:
          name: android-artifacts
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/release/*.apk
            app/build/outputs/bundle/release/*.aab
          if-no-files-found: error

      - name: upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-reports
          path: |
            app/build/reports
            app/build/test-results
          if-no-files-found: ignore
