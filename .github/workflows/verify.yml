name: verify

# Runs on every push and pull request. A milestone is only considered verified
# when the jobs below are green for the exact commit that was pushed.
on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write # publish failure logs to the ci-logs orphan branch
  checks: write

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

env:
  GRADLE_OPTS: "-Dorg.gradle.daemon=false -Dkotlin.incremental=true"

jobs:
  hygiene:
    name: repository hygiene
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: secret scan
        run: python3 tools/ci/secret_scan.py
      - name: repository checks
        run: python3 tools/ci/repo_hygiene.py

  core:
    name: domain core tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: run :core tests
        run: |
          set -o pipefail
          mkdir -p build-logs
          ./gradlew :core:test --stacktrace 2>&1 | tee build-logs/core-test.log
      - name: upload core test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: core-test-report
          path: core/build/reports/tests/test
          if-no-files-found: ignore
      - name: publish logs on failure
        if: failure()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 tools/ci/publish_log.py build-logs

  android:
    name: android build, tests and lint
    runs-on: ubuntu-latest
    needs: [hygiene, core]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: ensure android sdk platform
        run: |
          if [ ! -d "$ANDROID_HOME/platforms/android-35" ]; then
            yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "platforms;android-35" >/dev/null
          fi
          if [ ! -d "$ANDROID_HOME/build-tools/35.0.0" ]; then
            yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "build-tools;35.0.0" >/dev/null
          fi
          echo "installed platforms:" && ls "$ANDROID_HOME/platforms"

      - uses: gradle/actions/setup-gradle@v4

      - name: unit tests and debug apk
        run: |
          set -o pipefail
          mkdir -p build-logs
          ./gradlew :app:testDebugUnitTest :app:assembleDebug --continue --stacktrace 2>&1 \
            | tee build-logs/android-unit-tests.log

      - name: release apk, aab and lint
        run: |
          set -o pipefail
          mkdir -p build-logs
          ./gradlew :app:assembleRelease :app:bundleRelease :app:lintDebug --continue --stacktrace 2>&1 \
            | tee build-logs/android-release.log

      - name: upload apk and aab
        uses: actions/upload-artifact@v4
        with:
          name: android-artifacts
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/release/*.apk
            app/build/outputs/bundle/release/*.aab
          if-no-files-found: error

      - name: upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-reports
          path: |
            app/build/reports
            app/build/test-results
          if-no-files-found: ignore

      - name: publish logs on failure
        if: failure()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 tools/ci/publish_log.py build-logs
