name: Build Android APK

on:
  push:
    branches:
      - arena/01a09abf-secure-whatsapp-ai-architectur
    paths-ignore:
      - artifacts/**
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        run: gradle --no-daemon assembleDebug

      - name: Copy APK to a stable path
        run: |
          mkdir -p artifacts
          cp app/build/outputs/apk/debug/app-debug.apk artifacts/SecureWA-debug.apk

      - name: Commit APK to the session branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f artifacts/SecureWA-debug.apk
          git commit -m "Build SecureWA debug APK [skip ci]" || echo "APK unchanged"
          git push
