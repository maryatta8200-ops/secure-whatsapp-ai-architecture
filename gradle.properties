# Gradle / JVM tuning.
# The project is built on 2-core CI runners, so keep the heap bounded and let
# Gradle reuse build outputs instead of rebuilding.
org.gradle.jvmargs=-Xmx2048m -XX:MaxMetaspaceSize=512m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.daemon=true

# Android
android.useAndroidX=true
android.nonTransitiveRClass=true

# Kotlin
kotlin.code.style=official

# Release hardening flags are opt-in per milestone. They stay off until a
# validated ProGuard/R8 ruleset exists, so that a release build never silently
# produces a binary whose behaviour has not been exercised.
securewa.release.minifyEnabled=false
securewa.release.shrinkResources=false
